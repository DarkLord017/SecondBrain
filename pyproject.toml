[project]
name = "secondbrain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-openai",
    "langchain>=1.4",
    "guardrails-ai",
    "openai",
    "tiktoken>=0.8",
    "httpx>=0.27",
    "redis>=5.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "bcrypt>=4.0",
    "python-magic>=0.4.27",
    "neo4j>=5.24",
    "tenacity>=9.0",
    "langfuse",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7", "fakeredis>=2.24"]

[tool.setuptools.packages.find]
include = ["secondbrain*"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
